<script>try{var t=localStorage.getItem('am_theme');document.documentElement.setAttribute('data-theme',t?JSON.parse(t):(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}try{if(!window.CSSViewTransitionRule&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pt-fallback')}catch(e){}</script>

<body>
<main id="main">
  <section class="page-hero">
    <div class="container hero-anim">
      <span class="eyebrow">Гороскоп</span>
      <h1>Гороскоп <em class="accent">для вашего знака</em></h1>
      <p class="lead">Не шаблонные фразы, а расчёт по реальному небу: где сейчас Луна, Солнце, Венера и Марс относительно вашего знака. Выберите знак — свой или по Асценденту.</p>
    </div>
  </section>
  <section class="section tight" style="padding-top:0">
    <div class="container">
      <div class="pp-box" id="horoPeople" hidden style="margin-bottom:14px"></div>
      <div class="sign-picker" id="picker" role="group" aria-label="Знак зодиака"></div>
      <div class="card" style="margin-top:22px" id="horo"></div>
      <div class="card note-card" style="margin-top:24px" data-note="Гороскоп по знаку — лишь 1/12 картины. Личный прогноз на консультации учитывает всю вашу карту: Луну, Асцендент, дома и аспекты." data-note-cta='<button class="btn btn-primary btn-sm" type="button" data-book="forecast">Записаться на прогноз</button>'></div>
    </div>
  </section>
